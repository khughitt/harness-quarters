# default_permissions = ":workspace"
default_permissions = "workspace-local"
approval_policy = "never"
approvals_reviewer = "user"

personality = "pragmatic"
web_search = "live"

# codex-specific instructions
# codex-specific instructions: none; the profile fragments carry the per-project rules.
developer_instructions = ""

[permissions.workspace-local]
extends = ":workspace"
description = "Normal development with package-manager and Git metadata access."

[permissions.workspace-local.workspace_roots]
"/mnt/ssd/Dropbox/atoms" = true
"/mnt/ssd/Dropbox/autonomy" = true
"/mnt/ssd/Dropbox/beliefs" = true
"/mnt/ssd/Dropbox/nodes" = true
"/mnt/ssd/Dropbox/science" = true

[permissions.workspace-local.filesystem.":workspace_roots"]
".git" = "write"

[permissions.workspace-local.filesystem]
"/mnt/ssd3/work/" = "write"
"/mnt/ssd/.dropbox-work/" = "write"
"/mnt/ssd2/uv-cache/" = "write"
"/run/user/1000/agent-browser" = "write"
"~/.agent-browser" = "write"
"~/.cache/puppeteer" = "write"
"~/.codex/plugins/cache/openai-curated-remote/superpowers" = "read"
"~/.codex/superpowers" = "read"
"~/.local/state/tasks/claims" = "write"
"~/.npm" = "write"
"~/d/nodes/ts" = "read"

[permissions.workspace-local.network]
enabled = true
mode = "limited"

[permissions.workspace-local.network.domains]
"api.figshare.com" = "allow"
"api.github.com" = "allow"
"developers.openai.com" = "allow"
"files.pythonhosted.org" = "allow"
"github.com" = "allow"
"pubmed.ncbi.nlm.nih.gov" = "allow"
"pypi.org" = "allow"
"raw.githubusercontent.com" = "allow"
"registry.npmjs.org" = "allow"
"npmjs.com" = "allow"

[shell_environment_policy]
set = { TASKS_FORMAT = "json", TASKS_AGENT = "codex" }

[features]
shell_snapshot = true
js_repl = true
multi_agent = true

[tui]
status_line = ["model-with-reasoning", "context-remaining", "current-dir", "project-name", "git-branch"]
status_line_use_colors = true
theme = "noctalia"

[mcp_servers.ohai]
command = "node"
args = ["/home/keith/d/software/ohai/bin/ohai-mcp"]

[mcp_servers.ohai.env]
OHAI_DEFAULT_IMAGE = "openai"

[mcp_servers.ohai.tools.ohai]
approval_mode = "approve"

[mcp_servers.ohai.tools.ohai_status]
approval_mode = "approve"

