[facts.model-reset-clears-pick.harness.claude-code]
status = "probed"
value = true
version = "2.1.296"
date = 2026-10-10
evidence = "hq-f51af7"
note = "Choosing Default removed model from scratch settings.json and left no modelSettings, both after Opus and after Sonnet."

[facts.model-reset-clears-pick.harness.codex]
status = "probed"
value = false
version = "0.162.1"
date = 2026-10-10
evidence = "hq-f51af7"
note = "Changing to GPT-6-Astra, changing its effort to high, and selecting the medium default reasoning level all retained model and model_reasoning_effort. The model picker offered no default or reset entry."

[facts.answer-hook-terminal]
type = "boolean"
description = "In an interactive terminal session, a PreToolUse hook that blocks until an answer arrives from outside the terminal can answer the harness's question tool, and the same turn continues with that answer."

[facts.answer-hook-terminal.harness.agy]
status = "probed"
value = false
version = "1.4.12"
date = 2026-10-31
evidence = "hq-e72097"
note = "In an interactive terminal session on agy 1.4.12, PreToolUse fired on ask_question, blocked until an outside signal file arrived, and returned allow with overwrite setting answers for the asked question. agy prefixed the tool output with 'A pre-tool hook changed the arguments of this tool call before it ran. Changed: answers.' and still opened the interactive TUI question card, blocking until Esc dismissed it with 'A1: User Skipped': PreToolUse overwrite mutates toolCall.args before execution and cannot answer ask_question."

[facts.answer-hook-terminal.harness.claude-code]
status = "probed"
value = true
version = "2.1.296"
date = 2026-10-11
evidence = "hq-d85ede"
note = "AskUserQuestion; the hook returned allow with updatedInput echoing questions plus an answers map. Answered after 240 s, 660 s and 2100 s (35 min) with an explicit hook timeout of 86400, which lifts the 600 s default; no ceiling was reached. The terminal shows only a running-hooks spinner, never the question, and stays usable: typed messages queue and join the turn. Esc kills the hook; the terminal shows User declined to answer questions and the transcript records a rejected tool use. Closing the session kills the hook, and resume does not replay the pending call, which was never written to the transcript; asked again after a new prompt, the model re-asks under a new tool_use_id, so an answer keyed by question text alone answers the new question. A second answer has no consumer."

[facts.answer-hook-terminal.harness.codex]
status = "probed"
value = false
version = "0.162.1"
date = 2026-10-11
evidence = "hq-d85ede"
note = "PreToolUse fires on request_user_input in Default mode, where the tool then refuses, and in Plan mode, where the hook returned allow with updatedInput carrying an answers map, no error was shown, and the question stayed pending until dismissed: this route cannot answer. One updatedInput shape was tried. PermissionRequest reserves updatedInput and fails closed, per the hooks documentation."

[facts.answer-hook-terminal.harness.opencode]
status = "unknown"
note = "OpenCode plugin hooks were not probed; its server form route answers terminal sessions (answer-server-terminal)."

[facts.answer-defer-managed]
type = "boolean"
description = "In a managed session launched headless, the harness can stop at a question and a later resume delivers the answer to the same tool call."

[facts.answer-defer-managed.harness.agy]
status = "probed"
value = false
version = "1.4.12"
date = 2026-10-31
evidence = "hq-e72097"
note = "In headless agy -p runs on 1.4.12 (both default permissions and --dangerously-skip-permissions), ask_question never paused or exited the session: agy immediately returned 'A1: User Skipped' to the model in-turn and exited 0. Returning {\"decision\": \"defer\"} from a PreToolUse hook failed the tool call in-turn with 'unsupported hook decision: defer' (agy accepts only allow, deny, ask and force_ask)."

[facts.answer-defer-managed.harness.claude-code]
status = "probed"
value = true
version = "2.1.296"
date = 2026-10-11
evidence = "hq-d85ede"
note = "claude -p offers AskUserQuestion only with --permission-prompt-tool; the permission tool was never called. The hook returned defer: exit with stop_reason tool_deferred and deferred_tool_use. A resume with no answer deferred again on the same tool_use_id; a resume 4 min later returned allow with updatedInput and the turn completed. A second resume after the answer fails with No deferred tool marker found. An interactive session ignores defer and shows the native question."

[facts.answer-defer-managed.harness.codex]
status = "unknown"
note = "Codex hooks have no defer decision, codex exec lists both question tools; only the async one was called, and it returned accepted and let the run end, so the answer could only arrive as a new turn on resume, an inference not probed. The blocking tool under exec was not probed."

[facts.answer-server-terminal]
type = "boolean"
description = "In an interactive terminal session, an outside client of the harness's own session server receives a pending question, and its answer continues the same turn."

[facts.answer-server-terminal.harness.agy]
status = "unknown"
note = "Each agy 1.4.12 process runs an in-process loopback language-server endpoint (ANTIGRAVITY_LS_ADDRESS exported only to child processes, with zero-byte lockfiles in presence/), and agy remote-control registers a cloud-paired daemon rather than a local host control socket; no outside client route into an interactive terminal session was probed (hq-e72097)."

[facts.answer-server-terminal.harness.codex]
status = "probed"
value = true
version = "0.162.1"
date = 2026-10-11
evidence = "hq-d85ede"
note = "The TUI runs on the shared app-server daemon unless --no-daemon; a client speaks WebSocket over its unix control socket and calls thread/resume on the loaded thread. item/tool/requestUserInput reached every attached client and was replayed to one that attached after the question. An answer 120 s later was followed by serverRequest/resolved, which a later probe showed reaching every attached client; the TUI card closed and the same turn continued. A second response to the same request was ignored without error. The blocking tool runs only in Plan mode; Default mode refuses it."

[facts.answer-server-terminal.harness.opencode]
status = "probed"
value = true
version = "2.0.26"
date = 2026-10-11
evidence = "hq-d85ede"
note = "The TUI runs on a server (--server). The question tool raised a form.created event naming the tool call and listed it in GET /api/form; POST .../form/<id>/reply 3 min later returned 204 and the same turn continued. A second reply got 409 FormAlreadySettledError. DELETE on the form cancels it: the tool recorded The user dismissed this question, the step was interrupted and no model step followed. The probe sent the cancel message in the body, while the API declares it a query parameter; whether that message reaches the model was not probed."

[facts.answer-server-terminal.harness.claude-code]
status = "unknown"
note = "No session-server route into an interactive Claude Code session was probed."

[facts.answer-server-managed]
type = "boolean"
description = "With no terminal attached to the session, an outside client of the harness's session server receives a pending question, and its answer continues the same turn."

[facts.answer-server-managed.harness.agy]
status = "unknown"
note = "Neither agy remote-control nor the Antigravity Python SDK was probed as an outside question-answering session server without an attached terminal (hq-e72097)."

[facts.answer-server-managed.harness.codex]
status = "probed"
value = true
version = "0.162.1"
date = 2026-10-11
evidence = "hq-d85ede"
note = "The TUI was closed with a question pending; the thread stayed loaded in the daemon, and a client resuming it 60 s later got the request and its answer completed the turn. A daemon restart aborts the turn; the daemon started a recovery turn (same root turn, with the TUI attached) that asked again under a new itemId; the restarted daemon numbers request ids from 0 again. A client must compare itemId or turnId to tell a re-ask from the original; whether recovery runs with no client attached was not probed."

[facts.answer-server-managed.harness.opencode]
status = "probed"
value = true
version = "2.0.26"
date = 2026-10-11
evidence = "hq-d85ede"
note = "The TUI was closed with a form pending; a reply 30 s later completed the turn. A server restart drops pending forms: the reply gets 404 FormNotFoundError, the TUI shows the turn interrupted, and no re-ask appeared there."

[facts.answer-server-managed.harness.claude-code]
status = "unknown"
note = "The Agent SDK canUseTool route was not probed; the headless route probed here is answer-defer-managed."

[facts.answer-async-question]
type = "boolean"
description = "A question asked without blocking can be answered from outside the terminal: the turn ends at the question, and the answer reaches the model as a new turn."

[facts.answer-async-question.harness.agy]
status = "probed"
value = false
version = "1.4.12"
date = 2026-10-31
evidence = "hq-e72097"
note = "The 56-tool inventory emitted by headless agy 1.4.12 (--output-format stream-json init event) declares ask_question as the only question tool, with no async parameter or companion non-blocking question tool, and calling ask_question in an interactive terminal session blocks the turn on the TUI card rather than ending the turn."

[facts.answer-async-question.harness.codex]
status = "probed"
value = true
version = "0.162.1"
date = 2026-10-11
evidence = "hq-d85ede"
note = "request_user_input_async is recorded as an agentMessage with delivery async and its questions, and the turn ends. An outside client's turn/start on the thread appeared in the TUI and the model answered from it. Probed in an interactive TUI session. Nothing ties the answer to the question; that the card cannot be withdrawn rests on hq-5e63d9, not on this probe."

[facts.subagent-write-refused]
type = "set"
description = "The file basenames, as case-insensitive globs, for which the harness's file-write tool refuses a write by a subagent while the main agent may write them."
probe = "claude/probes/subagent-write-probe.py"

[facts.subagent-write-refused.harness.claude-code]
status = "probed"
value = ["ANALYSIS*.md", "FINDINGS*.md", "REPORT*.md", "SUMMARY*.md"]
version = "2.1.296"
date = 2026-10-12
evidence = "hq-7b65dc"
note = "Write's validateInput refuses a caller with an agent id when path.basename of the file matches /^(REPORT|SUMMARY|FINDINGS|ANALYSIS).*\\.md$/i, with 'Subagents should return findings as text, not write report files. Include this content in your final response instead.' A prefix match: reports.md and sub/report.md were refused; task-1-report.md, my-summary.md, report.txt and report/notes.md were written, and the main agent wrote main/report.md. In the 2.1.296 binary the rule appears only in Write's validateInput; Edit and Bash were not probed. A subagent refused once stops and answers in text, so the probe gives each name its own subagent."

[facts.session-start-before-first-turn]
type = "boolean"
description = "In an interactive terminal session, the harness fires its SessionStart hook when the session opens, before the first model turn."

[facts.session-start-before-first-turn.harness.agy]
status = "probed"
value = false
version = "1.4.12"
date = 2026-10-31
evidence = "hq-e72097"
note = "In an isolated interactive terminal session on agy 1.4.12 with onboarding pre-seeded, the TUI opened to the idle prompt ('? for shortcuts') and sat idle for 5 s with zero hook invocations; agy fired SessionStart only after the user submitted the first prompt."

[facts.session-start-before-first-turn.harness.claude-code]
status = "probed"
value = true
version = "2.1.304"
date = 2026-10-22
evidence = "hq-f27918"
note = "Every Claude Code start-idle smoke of the relay cutover window (four sessions across both hosts, personal and work homes, launched with --permission-mode manual and sent no prompt) showed the session's relay row, which its SessionStart hook writes, idle before the first prompt."

[facts.session-start-before-first-turn.harness.codex]
status = "probed"
value = false
version = "0.163.0"
date = 2026-10-22
evidence = "hq-f27918"
note = "The primary host's Codex work smoke (pid 62859) with the relay hooks installed and reviewed: no relay row after launch, after /status, or after the user shell command !true, which created the rollout and ran a task; SessionStart fired only with the first model turn. SessionStart cannot mark a Codex session before its first prompt; the cutover's start-idle check observes Codex after a fixed no-tool first prompt instead."

[facts.manual-mode-asks-for-sleep]
type = "boolean"
description = "In the default (manual) permission mode, with no allow rule covering it, a plain `sleep <seconds>` shell command waits for a permission answer before it runs."

[facts.manual-mode-asks-for-sleep.harness.claude-code]
status = "probed"
value = false
version = "2.1.304"
date = 2026-10-22
evidence = "hq-f27918"
note = "The primary host's Claude personal smoke f169ae86 (transcript permissionMode default; no allow rule in the home's settings names sleep): Bash 'sleep 7' ran with no permission dialog, while 'touch approval.marker && sleep 7' in the same session asked. A command meant to raise a permission prompt needs more than a plain sleep; a file write did it here. Which other commands run unasked, and why, was not probed."

[facts.mcp-stdio]
type = "boolean"
description = "In a headless run, the harness connects to a local MCP server over stdio from its own configuration, and the model calls one of the server's tools. Shown only for the protocol revisions mcp-stdio-revisions names."

[facts.mcp-stdio.harness.agy]
status = "probed"
value = true
version = "1.4.12"
date = 2026-10-31
evidence = "hq-e72097"
note = "In headless agy -p runs on 1.4.12 with a local stdio server configured in .gemini/config/mcp_config.json, agy connected over stdio and the model called the server's tool and replied with the server-held nonce, both against a stateful 2025-11-25 server and against a stateless-only 2026-07-28 server (mcp-stdio-revisions)."

[facts.mcp-stdio.harness.pi]
status = "probed"
value = true
version = "1.1.0"
date = 2026-10-11
evidence = "hq-57132d"
note = "RPC mode with the server in the agent directory's mcp.json and exposure direct: the model called mcp__probe__secret_word once and replied with the nonce only the server knew. The default exposure, codemode, was not probed. The probe server answers the revision pi requests, 2025-11-25; a server speaking only 2026-07-28 does not connect (mcp-stdio-revisions). The probe passed no --tools list: a list of plain names declares no MCP tool that none of its entries matches (such as mcp__<server>__*), and at exposure direct that tool is then unreachable even from codemode (hq-501726; earendil-works/pi#10634)."

[facts.mcp-stdio.harness.pi-durable]
status = "unknown"
note = "Not probed. The pi-durable README and exports name no MCP client; connecting one would be an extension of the integrator's, for example over pi-mcp."

[facts.mcp-stdio-revisions]
type = "set"
description = "The MCP protocol revisions for which mcp-stdio was shown: the revision the server answered on the connection whose tool the model called. A server that speaks only a revision outside the set was not shown to connect."

[facts.mcp-stdio-revisions.harness.agy]
status = "probed"
value = ["2025-11-25", "2026-07-28"]
version = "1.4.12"
date = 2026-10-31
evidence = "hq-e72097"
note = "In headless agy -p runs on 1.4.12, agy probed stdio MCP servers with 2026-07-28 stateless server/discover first (_meta['io.modelcontextprotocol/protocolVersion'] = '2026-07-28') and fell back to stateful initialize requesting protocolVersion '2025-11-25' when server/discover returned -32601. Separate probe servers speaking only 2025-11-25 (rejecting server/discover) and only 2026-07-28 (rejecting initialize and requiring 2026-07-28 _meta on tools/list and tools/call) each connected and delivered their secret nonce through a model tool call."

[facts.mcp-stdio-revisions.harness.pi]
status = "probed"
value = ["2025-11-25"]
version = "1.1.0"
date = 2026-10-11
evidence = "hq-57132d; hq-501726; sci-b40b23"
note = "pi's MCP runtime builds its client with no protocol version, so initialize requests the bundled pi-mcp's LATEST_PROTOCOL_VERSION, 2025-11-25 (read from the pinned source, hq-501726), and the hq-57132d probe server answers with the requested revision; the probe output does not record it. The same source accepts 2025-06-18, 2025-03-26 and 2024-11-05 from a server; none was probed. science's MCP server, which speaks only 2026-07-28 (stateless: server/discover in place of initialize, _meta on every request), did not connect: pi mcp list reported it failed with Request _meta is required (sci-b40b23 finding F1). Upstream: earendil-works/pi#10416, open."

# pi: `pi` is the CLI and its RPC mode, `pi-durable` the SDK's durable Harness; the CLI does
# not use pi-durable. Each harness's entries come from its own probe under pi/probes;
# the epoch rule: README.md, "Re-probing pi".

[facts.headless-controls]
type = "set"
description = "The controls shown working on a headless session: prompt (start a run that settles), steer (a message joins the running run), abort (stops a run and leaves the session idle), fork (a new session from an earlier entry), session-id (the session id survives a process restart)."

[facts.headless-controls.harness.pi]
status = "probed"
value = ["prompt", "steer", "abort", "fork", "session-id"]
version = "1.1.0"
date = 2026-10-11
evidence = "hq-57132d"
note = "RPC commands. A steer sent while bash ran was queued and placed after the tool result, and one reply answered both (DONE PINEAPPLE) with no second run settling in the next 5 s. abort during bash sleep 60 answered in 0.01 s with agent_settled aborted true and isStreaming false. fork from the latest user message gave a new session id holding the earlier messages. Reopening with --session gave the same session id."

[facts.headless-controls.harness.pi-durable]
status = "probed"
value = ["prompt", "steer", "abort", "fork", "session-id"]
version = "1.1.0"
date = 2026-10-11
evidence = "hq-57132d"
note = "SDK over sqlite storage. A whenBusy steer submitted while a tool ran was placed after the tool result and answered by the same run. abort() resolved in 6 ms, the tool saw its abort signal, the submission settled unanswered with reason aborted and pi.live was empty. fork(entry) gave a conversation whose context ends at that entry and a fresh pi.provider id. The conversation id and its pi.provider id survived a process restart."

[facts.idempotent-submission]
type = "boolean"
description = "Submitting an input again under the same request id returns the existing submission instead of running it a second time."

[facts.idempotent-submission.harness.pi]
status = "probed"
value = false
version = "1.1.0"
date = 2026-10-11
evidence = "hq-57132d"
note = "Two RPC prompt commands with the same id in one process, the second sent after the first settled, were both accepted as started and ran two agent runs. The RPC id only correlates a response with its command."

[facts.idempotent-submission.harness.pi-durable]
status = "probed"
value = true
version = "1.1.0"
date = 2026-10-11
evidence = "hq-57132d"
note = "A submission under one requestId, resubmitted from a new process over the same sqlite file, returned the same submission id, already done; the transcript kept one user and one assistant entry and pi.usage was unchanged."

[facts.child-conversations]
type = "boolean"
description = "The runtime itself lets a conversation be owned by a task of another, and aborting the owner aborts the owned conversation's work."

[facts.child-conversations.harness.pi]
status = "probed"
value = false
version = "1.1.0"
date = 2026-10-11
evidence = "hq-57132d"
note = "pi's README says it skips features like sub-agents. An inventory agrees: the built-in tools (pi --help) are read, bash, powershell, edit, write, grep, find and ls, and get_commands lists only extension, MCP and skill commands; nothing creates a child conversation. An extension could add a subagent tool, which this fact does not cover."

[facts.child-conversations.harness.pi-durable]
status = "probed"
value = true
version = "1.1.0"
date = 2026-10-11
evidence = "hq-57132d"
note = "A subagent tool (the README's pattern, integrator code) created the child with ownership by its own pi.tool task; the child ran and answered. Aborting the root while the child's tool ran aborted the child's submission, generation and tool; endedAt order was child tool, child generation, parent call, parent generation, 1 ms apart."

[facts.turn-resumes-after-kill]
type = "boolean"
description = "After the process is killed while a tool call runs, reopening the session continues the interrupted turn to an answer without new user input."

[facts.turn-resumes-after-kill.harness.pi]
status = "probed"
value = false
version = "1.1.0"
date = 2026-10-11
evidence = "hq-57132d"
note = "The process group was killed during bash sleep 30. Reopened with --session: no run started in 40 s, isStreaming false, and the transcript ended at the assistant tool call with no tool result persisted. A later prompt Continue. made the model run the same command again, describing the first call as returning No result provided; nothing pi persisted marks that call as interrupted."

[facts.turn-resumes-after-kill.harness.pi-durable]
status = "probed"
value = true
version = "1.1.0"
date = 2026-10-11
evidence = "hq-57132d"
note = "The process was SIGKILLed 0.5 s into a 30 s tool call. On reopen the tool task was pending and the submission placed; after resume() the run answered with no new input. A tool not declared replay safe did not rerun: the model got an error result, Tool slow was interrupted and may have partially run (code interrupted). A replay-safe tool reran in the new process and its result reached the answer."

