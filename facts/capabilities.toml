# Capability facts: what each harness has been shown to do, and where that is recorded.
# Read only through tools/harness-facts (a command, or a module). Edit in a worktree.
# Re-probing: README.md, "Re-probing a fact". Design: docs/specs/2026-10-06-residue-design.md §4.
schema = 1
harnesses = ["agy", "claude-code", "codex", "opencode", "pi", "pi-durable"]

[facts.controller-wake]
type = "boolean"
description = "The harness starts a new controller turn, without human input, when a child it runs finishes."
probe = "agents/bin/wake-judge"

[facts.controller-wake.harness.agy]
status = "probed"
value = true
version = "1.4.12"
date = 2026-10-31
evidence = "hq-e72097"
note = "Both child kinds woke the controller in isolated interactive terminal sessions on agy 1.4.12; wake-judge agy reported PASS on both compact and full transcripts. In each run the controller launched the child, replied WAITING, and fired Stop with executionNum 0 and fullyIdle false; when the child finished, agy appended a SYSTEM SYSTEM_MESSAGE ([Message] timestamp=... sender=<child-id> ...), woke the controller without human input, and the controller replied with the nonce before firing Stop with fullyIdle true."

[facts.controller-wake.harness.claude-code]
status = "probed"
value = true
version = "2.1.295"
date = 2026-10-08
evidence = "hq-b2515c"
note = "Both child kinds woke in isolated interactive sessions on Claude Code 2.1.295; wake-judge PASS for each final transcript. The judge learned the harness-generated remote_session_change context attachment and exit-time cost-state usage metadata. Evidence and raw transcript references are recorded on hq-b2515c."

[facts.controller-wake.harness.codex]
status = "probed"
value = false
version = "0.156.1"
date = 2026-09-24
evidence = "tack-00ccb6"
note = "Neither child kind woke the controller: for each, the turn ended, the child finished, and no new turn began within 170 seconds, in the terminal interface. A bounded observation, not a judge verdict: the judge knows no Codex completion form."

[facts.controller-wake-kinds]
type = "set"
description = "The kinds of child for which a wake was shown, as Claude Code's Stop input names them in `type`: shell is a background command, subagent a subagent."
probe = "agents/bin/wake-judge"

[facts.controller-wake-kinds.harness.agy]
status = "probed"
value = ["shell", "subagent"]
version = "1.4.12"
date = 2026-10-31
evidence = "hq-e72097"
note = "In isolated interactive terminal sessions on agy 1.4.12, a non-daemon background run_command (WaitMsBeforeAsync 500, IsDaemon false, sender <conversationId>/task-<N>) and an invoke_subagent child (TypeName self, sender <childConversationId>) each woke the controller (wake-judge agy PASS). In an isolated interactive terminal session, a daemon run_command (IsDaemon true) reported fullyIdle true on Stop while still running; whether a finishing daemon emits a completion wake was not probed."

[facts.controller-wake-kinds.harness.claude-code]
status = "probed"
value = ["shell", "subagent"]
version = "2.1.295"
date = 2026-10-08
evidence = "hq-b2515c"
note = "A background command and a background subagent each woke the controller in isolated interactive sessions (wake-judge PASS). The headless Stop capture also names their types shell and subagent."

[facts.controller-wake-kinds.harness.codex]
status = "probed"
value = []
version = "0.156.1"
date = 2026-09-24
evidence = "tack-00ccb6"
note = "Both kinds were run, in the terminal interface, and neither woke."

[facts.stop-input-in-flight-statuses]
type = "set"
description = "The statuses Claude Code's Stop input gives, in background_tasks, to work that is still to finish."

[facts.stop-input-in-flight-statuses.harness.agy]
status = "unknown"
note = "agy 1.4.12's Stop JSON payload has no background_tasks array or per-task status strings (probed in both headless agy -p and interactive terminal sessions on hq-e72097); instead agy sends boolean fullyIdle, which was false while a non-daemon background run_command or invoke_subagent child ran and true once they finished (and true while an IsDaemon true command remained running)."

[facts.stop-input-in-flight-statuses.harness.claude-code]
status = "probed"
value = ["running", "pending"]
version = "2.1.295"
date = 2026-10-08
evidence = "hq-b2515c; ops-ed76fe"
note = "The headless Claude Code 2.1.295 Stop capture lists both shell and subagent as running. pending was not observed; it remains supported only by the guard review in ops-ed76fe. The value is unchanged, and this refresh does not newly verify pending."

[facts.model-pick-event]
type = "boolean"
description = "A hook event fires when the session's model is picked, after the pick is written to the user settings file."

[facts.model-pick-event.harness.claude-code]
