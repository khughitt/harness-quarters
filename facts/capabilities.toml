evidence = "hq-57132d"
note = "Each conversation's pi.usage document and harness.usage() give, per provider/model, input, output, cacheRead, cacheWrite, cacheWrite1h, reasoning and totalTokens, and cost by part with a total."

[facts.usage-includes-children]
type = "boolean"
description = "The usage the runtime reports for a conversation includes the spend of the conversations its tasks own, without the integrator summing them."

[facts.usage-includes-children.harness.pi]
status = "unknown"
note = "The CLI has no child conversations at 1.1.0 (child-conversations), so there is nothing to include."

[facts.usage-includes-children.harness.pi-durable]
status = "probed"
value = false
version = "1.1.0"
date = 2026-10-11
evidence = "hq-57132d"
note = "After a subagent run the root's pi.usage held 1518 tokens, exactly its own assistant entries, and the child's held 586. harness.usage() is every conversation in the storage summed (its type says so): it read 2104 only because the probe gave the run a storage of its own. A task's spend in a shared storage is the integrator's sum over the conversations it owns."

