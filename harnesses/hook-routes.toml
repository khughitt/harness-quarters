[homes.agy]
harness = "agy"
path = "harnesses/agy/hooks.json"
bindings = [
  { event = "SessionStart", lines = [{ policies = ["agy-healing", "claude-profile", "capture-notice"], command = "~/d/hq/harnesses/agy/hook SessionStart ~/d/lore/hooks/claude-profile ~/d/ops/hooks/capture-notice" }] },
  { event = "SessionStart", lines = [{ policies = ["relay-hooks", "familiar"], runtime = "v0.5.0", relay_kind = "session-start", subscriber_file = "shared-v0.5.0", outer_ms = 60000, timeout = 60 }] },
  { event = "PreToolUse", matcher = "run_command", lines = [{ policies = ["agy-healing"], command = "~/d/hq/harnesses/agy/hook PreToolUse" }] },
  { event = "PreToolUse", matcher = "*", lines = [{ policies = ["relay-hooks", "ops-guard", "familiar"], runtime = "v0.5.0", relay_kind = "before-tool", subscriber_file = "shared-v0.5.0", outer_ms = 60000, timeout = 60 }] },
  { event = "Stop", lines = [{ policies = ["agy-healing", "claim-guard"], command = "~/d/hq/harnesses/agy/hook Stop" }] },
  { event = "Stop", lines = [{ policies = ["agy-harness-state-refresh"], command = "~/.local/bin/harness-state-refresh" }] },
  { event = "Stop", lines = [{ policies = ["relay-hooks", "familiar"], runtime = "v0.5.0", relay_kind = "turn-end", subscriber_file = "shared-v0.5.0", outer_ms = 60000, timeout = 60 }] },
]
