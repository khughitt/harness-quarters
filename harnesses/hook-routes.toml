# Ordered bindings for the checked-in hook settings.
# relay_kind and subscriber policies are the coverage observed for the pinned relay.
reconciliation_file = "shared-v0.5.0-retired-guard"

[runtimes."v0.5.0"]
command = "/usr/bin/node"
script = "~/.local/share/relay/v0.5.0/node_modules/relay/bin/relay.js"
commit = "1f1c28da62e7867caf3acaddf16ba13079a37e85"

[runtimes."v0.6.0"]
command = "/usr/bin/node"
script = "~/.local/share/relay/v0.6.0/node_modules/relay/bin/relay.js"
commit = "9078727105f06b4a17ccbf177821806d7eed93be"

[states.claude-sessionstart]
state = "native"
owner = "hq-a83688"
reason = "Keeps the halt, stale-instructions and index notices until their owner commands can run."

[states.claude-profile]
state = "native"
owner = "hq-a83688"
reason = "Keeps the profile notice until its owner command can run."

[states.capture-notice]
state = "native"
owner = "hq-a83688"
reason = "Keeps the capture notice until its owner command can run."

[states.claim-guard]
state = "native"
owner = "hq-a83688"
reason = "Keeps claim enforcement until the owner route is proved equivalent."

[states.claude-posttooluse]
state = "native"
owner = "ops"
reason = "The relay amendment retains native PostToolUse and PostToolUseFailure for the test counter; ops supplies tt's command on PATH."

[states.agy-healing]
state = "native"
owner = "hq"
reason = "Detached agy settings healing stays outside the bridge extraction."

[states.turn-pause]
state = "native"
owner = "hq"
reason = "Keep one counter across native PostToolUse, compaction and events without relay installer bindings."

[states.harness-state-refresh]
state = "native"
owner = "hq"
reason = "Keep the PATH link until the Claude and Codex Stop routes qualify."

[states.agy-harness-state-refresh]
state = "native"
owner = "hq"
reason = "agy healing stays outside the bridge."

[states.relay-hooks]
state = "existing"
owner = "relay-d487c1"
grant = "hq-663049"
activation = "ops-47f5dc:guard-cutover-activation"

[states.relay-provenance]
state = "existing"
owner = "relay-d487c1"
grant = "hq-663049"
activation = "ops-47f5dc:guard-cutover-activation"

[states.familiar]
state = "existing"
owner = "relay-d487c1"
grant = "hq-663049"
activation = "ops-47f5dc:guard-cutover-activation"

[subscribers.familiar]
policy = "familiar"
role = "observer"
registry = "snapshot"
privateFields = [{ nativeEvent = "Stop", fields = ["backgroundTasks"] }]
argv = ["env", "~/d/familiar/bin/familiar", "observe"]
timeoutMs = 2000

[subscribers.familiar-codex-workers]
policy = "familiar"
role = "observer"
registry = "snapshot"
argv = ["env", "~/d/familiar/bin/familiar", "observe"]
timeoutMs = 2000

[subscribers.familiar-opencode]
policy = "familiar"
role = "observer"
registry = "snapshot"
argv = ["env", "~/d/familiar/bin/familiar", "observe"]
timeoutMs = 1000

[subscribers.familiar-teardown]
policy = "familiar"
role = "observer"
registry = "snapshot"
argv = ["env", "~/d/familiar/bin/familiar", "observe"]
timeoutMs = 400

[subscribers.familiar-agy]
policy = "familiar"
role = "observer"
registry = "snapshot"
argv = ["env", "~/d/familiar/bin/familiar", "observe"]
timeoutMs = 2000

[subscribers.tasks-halt-notice]
policy = "claude-sessionstart"
role = "notice"
argv = ["tasks", "hook", "halt-notice"]
timeoutMs = 1000

[subscribers.lore-stale-notice]
policy = "claude-sessionstart"
role = "notice"
argv = ["lore", "hook", "stale-notice"]
timeoutMs = 12000

[subscribers.git-index-repair]
policy = "claude-sessionstart"
role = "notice"
argv = ["git-index-health", "--session-start"]
timeoutMs = 6000

[subscribers.lore-profile-notice]
policy = "claude-profile"
role = "notice"
argv = ["lore", "hook", "profile-notice"]
timeoutMs = 3000

[subscribers.mindful-capture-notice]
policy = "capture-notice"
role = "notice"
argv = ["mindful", "notice", "session-start"]
timeoutMs = 2000

[subscribers.tasks-claim-guard]
policy = "claim-guard"
role = "guard"
argv = ["tasks", "hook", "claim-guard"]
timeoutMs = 12000

[subscribers.tasks-claim-guard-codex]
policy = "claim-guard"
role = "guard"
argv = ["tasks", "hook", "claim-guard"]
timeoutMs = 12000

[subscribers.harness-state-refresh]
policy = "harness-state-refresh"
role = "observer"
argv = ["harness-state-refresh"]
timeoutMs = 6000
registry = "occurrence"

[subscriber_files."shared-v0.5.0-retired-guard"]
runtime = "v0.5.0"
output = "relay/subscribers.template.json"
subscribers = [
  { name = "familiar", harnesses = ["claude-code", "codex"], kinds = ["session-start", "prompt", "before-tool", "activity", "idle", "needs-input", "needs-approval", "turn-end", "turn-error", "reconcile"] },
  { name = "familiar-codex-workers", harnesses = ["codex"], kinds = ["child-start", "child-stop"] },
  { name = "familiar-opencode", harnesses = ["opencode"], kinds = ["session-start", "activity", "idle", "needs-approval", "turn-error", "session-end"] },
  { name = "familiar-teardown", harnesses = ["claude-code"], kinds = ["session-end"] },
  { name = "familiar-agy", harnesses = ["agy"], kinds = ["session-start", "before-tool", "turn-end"] },
]

# hq donor-2 composition (frozen hq-a83688 candidates/donor-2, sha256 19b427ac...),
# qualified by relay-d487c1 for Claude Code 2.1.331 SessionStart and Stop.
[subscriber_files."donor-2-shared"]
runtime = "v0.5.0"
output = "relay/subscribers.donor-2.template.json"
subscribers = [
  { name = "familiar", harnesses = ["claude-code", "codex"], kinds = ["session-start", "turn-end"] },
  { name = "familiar-codex-workers", harnesses = ["codex"], kinds = ["child-stop"] },
  { name = "tasks-halt-notice", harnesses = ["claude-code"], kinds = ["session-start"] },
  { name = "lore-stale-notice", harnesses = ["claude-code"], kinds = ["session-start"] },
  { name = "git-index-repair", harnesses = ["claude-code"], kinds = ["session-start"] },
  { name = "lore-profile-notice", harnesses = ["claude-code", "codex"], kinds = ["session-start"] },
  { name = "mindful-capture-notice", harnesses = ["claude-code", "codex"], kinds = ["session-start"] },
  { name = "tasks-claim-guard", harnesses = ["claude-code"], kinds = ["turn-end"] },
  { name = "tasks-claim-guard-codex", harnesses = ["codex"], kinds = ["turn-end", "child-stop"] },
  { name = "harness-state-refresh", harnesses = ["claude-code", "codex"], kinds = ["turn-end"] },
]

