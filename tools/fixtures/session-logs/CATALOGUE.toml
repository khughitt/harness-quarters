# Session evidence sample catalogue. All fixtures are synthetic conformance inputs.
# Consumer oracle: obs fe61869f0041eff423ed495d10845ef3cf3d5638; hq 3163fab9d3bea604617003b46ca63d0f8a076b57.
# Origin evidence/labels are hand-derived; consumer results were run once from frozen code.
# TOML has no null: omitted native_kind and marker lead/joined mean null only.
# All other evidence keys are required. Absence in a sample means unobserved, never unsupported.
# CWAIT is captures/turn-evidence-claude.jsonl; XE covers Codex turn ends and phases.

