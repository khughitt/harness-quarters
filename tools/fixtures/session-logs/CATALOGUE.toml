# Session evidence sample catalogue. Observed derivatives are labelled separately from synthetic cases.
# Consumer oracle: obs fe61869f0041eff423ed495d10845ef3cf3d5638; hq 3163fab9d3bea604617003b46ca63d0f8a076b57.
# Origin evidence/labels are hand-derived; consumer results were run once from frozen code.
# TOML has no null: omitted native_kind and marker lead/joined mean null only.
# All other evidence keys are required. Absence in a sample means unobserved, never unsupported.
# CWAIT is captures/turn-evidence-claude.jsonl; XE covers Codex turn ends and phases.

# Known synthetic format versions come from native fields, independently of provenance.
# Unspecified versions stay unknown; no synthetic sample establishes observed emission.

# agy index samples: synthetic steps; their summaries rows are conversation_summaries.sql beside brain/.
# Expected events: index_events lists each index_event's native_kind in order, unparsed each
# unparsed object's reason; calls, results and notifications count those arrays' entries.
[[sample]]
path = "agy-index/.gemini/antigravity-cli/brain/b9000000-0000-4000-8000-000000000001/.system_generated/logs/transcript_full.jsonl"
harness = "agy"
version = "unknown"
provenance = "synthetic"
profile = "index"
index_events = ["USER_INPUT", "PLANNER_RESPONSE", "GENERIC", "GENERIC", "GENERIC", "PLANNER_RESPONSE", "GENERIC", "PLANNER_RESPONSE", "GENERIC", "USER_INPUT", "PLANNER_RESPONSE"]
unparsed = []
calls = 6
results = 5
notifications = 0

