# Every link from a home directory into a registered checkout. `just link` reports what it would
# change; `just link --apply` converges this host. Required links go on every host;
# a harness group applies only where that harness's home is a real directory.
# Targets under local/ are untracked (Dropbox carries them between hosts); `just setup`
# creates the directories a public clone needs.

# A directory's value is its former link target, used to prove ownership before
# conversion. Targets may be checkout-relative or <project>:<relative-path>.
[directories]
"~/.agents" = "agents"
"~/.agents/bin" = "agents/bin"
"~/.agents/skills" = "agents/skills"

[required]
"~/.config/AGENTS.md" = "lore:instructions/AGENTS.md"
"~/.local/bin/harness-state-refresh" = ".githooks/harness-state-refresh"
"~/.config/systemd/user/session-archive-capture.service" = "systemd/user/session-archive-capture.service"
"~/.config/systemd/user/session-archive-capture.timer" = "systemd/user/session-archive-capture.timer"
"~/.config/systemd/user/session-archive-prune.service" = "systemd/user/session-archive-prune.service"
"~/.config/systemd/user/session-archive-prune.timer" = "systemd/user/session-archive-prune.timer"

# The aggregate surface stays in tack until the owner of each entry moves.
"~/.agents/.skill-lock.json" = "lore:.skill-lock.json"
"~/.agents/evals" = "flows:evals"
"~/.agents/flow" = "flows:flow"
"~/.agents/profiles" = "lore:profiles"
"~/.agents/vendor" = "lore:vendor"
