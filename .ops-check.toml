layout_allowed = [
  # Host configuration by design: harness homes read these absolute paths literally
  # (or, for agy/settings.json, write stripped live trustedWorkspaces paths in place).
  # harnesses/pi/settings.json stays checked: /settings writes no path keys, pi's
  # project trust lives in ~/.pi/agent/trust.json, and any path written to sessionDir,
  # shellPath, packages, extensions, skills, prompts or themes is not stripped by the
  # clean filter and would be committed if allowed here.
  "harnesses/claude/settings.json",
  "harnesses/claude/work/settings.json",
  "harnesses/codex/config.toml",
  "harnesses/codex/hooks.json",
  "harnesses/codex/work/hooks.json",
  "harnesses/agy/hooks.json",
  "harnesses/agy/settings.json",
  # Route source for the exact native commands and subscriber argv used today.
  "harnesses/hook-routes.toml",
  # Exact deployed hook strings are the contract these wiring tests protect.
  "tools/test_capture_notice_wiring.py",
  "tools/test_claim_guard_wiring.py",
  "tools/test_relay_wiring.py",
  # A privacy denylist that names the hosts in order to forbid them in session-log fixtures.
  "tools/session_log_private.py",
]
